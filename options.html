<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Touch Grass — options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f2f8f2;
      color: #17301c;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .wrap { max-width: 520px; width: 100%; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .tag { color: #5a7a60; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-weight: 600; font-size: 14px; margin: 18px 0 6px; }
    .hint { font-size: 12px; color: #8aa890; margin-top: 4px; }
    textarea, input {
      width: 100%;
      border: 2px solid #cfe3d3;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: white;
    }
    textarea { height: 140px; resize: vertical; }
    textarea:focus, input:focus { border-color: #2e9e4f; }
    button {
      margin-top: 20px;
      background: #2e9e4f;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1f7a3a; }
    .saved { display: none; margin-left: 10px; color: #1f7a3a; font-weight: 600; }
    .stats { margin-top: 28px; padding: 14px; background: #e7f3ea; border-radius: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🌿 Touch Grass</h1>
    <p class="tag">You're not giving anything up.</p>

    <label for="domains">Blocked domains (one per line)</label>
    <textarea id="domains" spellcheck="false"></textarea>
    <p class="hint">Subdomains are blocked automatically (instagram.com covers www, m., etc.)</p>

    <label for="giphyKey">Giphy API key (optional — powers the GIFs)</label>
    <input id="giphyKey" type="text" placeholder="paste key from developers.giphy.com" />
    <p class="hint">Free: developers.giphy.com → Create App → API. Without a key you get the emoji cards.</p>

    <button id="save">Save</button><span class="saved" id="saved">Saved ✓</span>

    <div class="stats" id="stats"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
